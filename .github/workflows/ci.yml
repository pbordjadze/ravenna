name: CI

# Linux, on every push: MosaicKit and MosaicCore with their tests (SwiftPM).
# macOS, only when asked or when the app changed on main: the five macOS runners are shared with
# Paint by Moonlight, which always goes first (CLAUDE.md). Ask its setup session for a slot first.
#   compile  `[compile]` in a branch's pushed commit message: an unsigned Debug build of the app.
#   shots    `[shots]` in a branch's pushed commit message, or a manual run with `shots` ticked: a Debug simulator build, and each screen
#            screenshotted (iPhone at the default and the largest text size, iPad at the default),
#            as the `shots` artifact. Each is a demo scenario (`-demo <name>`, Debug only: the
#            catalogs are ShellDemo's, PaintDemoView's and RootView's doc comments), shot once it
#            says it is ready (DemoMode.markReady).
#   determinism  `[determinism]` in a branch's pushed commit message: the Determinism tests on
#            Apple silicon, against Linux's hashes (SwiftPM, no Xcode project).
#   ipa      main, when the app or what it links changed (or `[ipa]` on a branch, which archives
#            without publishing): an unsigned Release archive as a `build-<n>` prerelease (five
#            kept) and the SideStore source on the `sidestore` branch. Adapted from paint-by-number.
# Every job that builds first checks out paint-by-number at the pinned commit (tools/paintcore.sh).

on:
  push:
    branches-ignore: ['sidestore']
  workflow_dispatch:
    inputs:
      shots:
        description: Screenshot every screen (the shots job)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: App/Ravenna.xcodeproj
  SCHEME: Ravenna

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false, fetch-depth: 0 }
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(App/|Sources/Mosaic(Kit|Engine|Core)/|Package.swift|tools/paintcore.sh)'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    name: App compile check (macOS, unsigned Debug)
    if: github.ref_name != 'main' && contains(github.event.head_commit.message, '[compile]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: PaintCore at its pin
        run: tools/paintcore.sh
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS' -derivedDataPath build/dd -quiet \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/compile.log | tail -80
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: compile, path: out, if-no-files-found: ignore }

  shots:
    name: Screenshots (macOS, simulator)
    if: github.ref_name != 'main' && (contains(github.event.head_commit.message, '[shots]') || inputs.shots)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: PaintCore at its pin
        run: tools/paintcore.sh
      - name: Build
        run: |
          set -o pipefail
          mkdir -p out
          xcodebuild build -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd -quiet \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee out/build.log | tail -80
      - name: Shoot
        run: |
          set -euo pipefail
          APP=$(find build/dd/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          pick() {
            xcrun simctl list devices available -j | python3 -c "import json,sys
          ds=[d for r,l in json.load(sys.stdin)['devices'].items() if 'iOS' in r for d in l]
          m=[d for d in ds if '$1' in d['name'] and 'Max' not in d['name'] and 'mini' not in d['name']]
          m=m or [d for d in ds if '$1'.split()[0] in d['name']]
          print(sorted(m, key=lambda d: d['name'])[-1]['udid'])"
          }
          shoot() {  # device, label, text size, scenarios...
            local dev=$1 label=$2 size=$3; shift 3
            xcrun simctl ui "$dev" content_size "$size"
            for shot in "$@"; do
              xcrun simctl terminate "$dev" "$BUNDLE" 2>/dev/null || true
              local ready
              ready="$(xcrun simctl get_app_container "$dev" "$BUNDLE" data)/tmp/demo-ready"
              rm -f "$ready"
              xcrun simctl launch "$dev" "$BUNDLE" -demo "$shot" >/dev/null
              for i in $(seq 1 120); do
                [ -f "$ready" ] && break
                # Gone (it crashed): no use waiting out the two minutes.
                if [ "$i" -gt 5 ] && ! xcrun simctl spawn "$dev" launchctl list 2>/dev/null | grep "$BUNDLE" >/dev/null; then
                  echo "::warning::$label $shot is no longer running"; break
                fi
                sleep 1
              done
              if [ ! -f "$ready" ]; then
                echo "::warning::$label $shot never said it was ready"
                # The app's own log for the scenario that didn't make it, kept beside its shot.
                xcrun simctl spawn "$dev" log show --last 3m --style compact \
                  --predicate "process == \"$(basename "$APP" .app)\"" > "out/$label-$shot.log" 2>&1 || true
              fi
              sleep 2
              xcrun simctl io "$dev" screenshot "out/$label-$shot.png" >/dev/null
              # The measuring demo's report (frame times, memory), when it wrote one.
              local measured
              measured="$(xcrun simctl get_app_container "$dev" "$BUNDLE" data)/tmp/canvas-measure.txt"
              if [ -f "$measured" ]; then cp "$measured" "out/$label-$shot.txt"; rm -f "$measured"; fi
            done
          }
          ALL="gallery-first-run create-samples create-preview create-custom making-of making-of-end paint paint-progress paint-complete"
          # The painting screen's tiles, at the default text size only.
          TILES="paint-zoom paint-setting paint-finish paint-replay paint-mosaic-measure"
          for kind in "iPhone 17 Pro:iphone" "iPad Pro 11:ipad"; do
            dev=$(pick "${kind%%:*}") label=${kind##*:}
            xcrun simctl boot "$dev"; xcrun simctl bootstatus "$dev" -b >/dev/null
            xcrun simctl status_bar "$dev" override --time 9:41 --batteryLevel 100 || true
            xcrun simctl ui "$dev" appearance dark
            xcrun simctl install "$dev" "$APP"
            shoot "$dev" "$label" large $ALL $TILES
            if [ "$label" = iphone ]; then shoot "$dev" "$label-ax5" accessibility-extra-extra-extra-large $ALL; fi
            xcrun simctl shutdown "$dev"
          done
          # Crash reports of the app, if any scenario crashed.
          cp ~/Library/Logs/DiagnosticReports/"$(basename "$APP" .app)"*.ips out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: shots, path: out, if-no-files-found: ignore }

  ipa:
    name: IPA for SideStore (unsigned device build)
    needs: changes
    if: (github.ref_name == 'main' && needs.changes.outputs.app == 'true') || contains(github.event.head_commit.message, '[ipa]')
    permissions:
      contents: write
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: PaintCore at its pin
        run: tools/paintcore.sh
      - name: Archive
        run: |
          set -o pipefail
          mkdir -p out
          # Version 0.1.<run>, build <run>: every build is an update to the installed one.
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Ravenna.xcarchive -quiet \
            MARKETING_VERSION="0.1.$BUILD" CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee out/ipa-build.log | tail -80
      - name: Package
        run: |
          # SideStore signs the app with the user's Apple ID when installing it.
          APP=build/Ravenna.xcarchive/Products/Applications/Ravenna.app
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../../out/Ravenna.ipa Payload)
          ls -l out/Ravenna.ipa
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" "$APP/Info.plist"
      - name: Publish release and SideStore source
        if: github.ref_name == 'main'
        run: |
          # The last non-merge commit's subject, without CI tags such as [compile] or [ipa].
          git log -1 --no-merges --format=%s | sed -E 's/ *\[(compile|ipa)\]//g' > out/notes.txt
          gh release create "build-$BUILD" out/Ravenna.ipa --prerelease --target "$GITHUB_SHA" \
            --title "Build $BUILD" --notes-file out/notes.txt
          # Keep the five newest builds (KEEP in ci/sidestore_source.py: the same number).
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep '^build-' | tail -n +6 |
            while read -r tag; do gh release delete "$tag" --yes --cleanup-tag; done
          SOURCE="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/sidestore"
          mkdir -p build/source
          python3 ci/sidestore_source.py build/Ravenna.xcarchive/Products/Applications/Ravenna.app \
            "$SOURCE/icon.png" > build/source/source.json
          cp App/Ravenna/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png build/source/icon.png
          printf '# SideStore source\n\nAdd %s/source.json in SideStore (Sources → +).\n' "$SOURCE" > build/source/README.md
          cp build/source/source.json out/
          cd build/source
          git init -q && git checkout -q -b sidestore && git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "SideStore source for build $BUILD"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "sidestore:refs/heads/sidestore"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ipa
          path: |
            out
            !out/*.ipa
          if-no-files-found: ignore

  determinism:
    # `[determinism]` in a branch's pushed commit message: the Determinism suite on Apple silicon,
    # whose hashes are Linux's (Tests/MosaicCoreTests/DeterminismTests.swift). Debug and release.
    name: Same mosaic on Apple silicon (macOS, SwiftPM)
    if: github.ref_name != 'main' && contains(github.event.head_commit.message, '[determinism]')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: PaintCore at its pin
        run: tools/paintcore.sh
      - name: Test
        run: |
          set -o pipefail
          uname -m; swift --version
          status=0
          for c in debug release; do
            swift test -c $c --filter Determinism 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]' || status=1
          done
          exit $status
      - name: Time and memory at the top of the Pieces slider
        if: ${{ !cancelled() }}
        # The engine on Apple silicon at 1448 px (the old top) and 1774 px (the slider's top), the
        # fixture portrait scaled up: wall time and peak memory, a stand-in for a phone's.
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --product mosaic 2>&1 | tail -1
          F=Tests/Fixtures/determinism
          for side in 1448 1774; do
            echo "== $side px"
            /usr/bin/time -l .build/release/mosaic $F/photo.ppm $F/contours.pgm "$RUNNER_TEMP/bench-$side" \
              --features $F/features.json --long-side $side > "$RUNNER_TEMP/bench-$side.log" 2>&1
            grep -E 'tiles|real|maximum resident' "$RUNNER_TEMP/bench-$side.log"
          done

  core:
    name: MosaicKit and MosaicCore build and tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'tools/paintcore.sh') }}
      - name: PaintCore at its pin
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/paintcore.sh
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          swift build --build-tests 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          swift test --skip-build 2>&1 | grep -vE '^\[[0-9]+/[0-9]+\]'
